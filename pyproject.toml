[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "srmod"
version = "0.1.0"
description = "Сборка модов для Space Rangers HD: A War Apart"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.urls]
Homepage = "https://github.com/ArtYudin89/sr-modkit"

[project.scripts]
srmod = "srmod.cli:main"

[tool.setuptools]
packages = ["srmod"]
